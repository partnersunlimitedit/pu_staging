<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sign-in — Partners Unlimited</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Staff sign-in for the Partners Unlimited admin portal.">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="assets/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/main.js" defer></script>
<script src="assets/admin.js" defer></script>
</head>
<body class="admin-body" data-admin-page="signin">

<header class="admin-bar">
  <div class="container admin-bar-inner">
    <a class="admin-brand" href="../index.html" title="Partners Unlimited">
      <img src="../assets/img/logo.png" alt="Partners Unlimited" width="120" height="75">
      <span>Admin</span>
    </a>
  </div>
</header>

<main class="admin-main">
  <section class="admin-signin section">
    <div class="container admin-signin-wrap">
      <div class="form-card admin-signin-card" data-reveal>
        <p class="eyebrow">Staff only</p>
        <h1 class="section-title" style="font-size:1.75rem;">Admin sign-in</h1>
        <p class="muted" style="margin-bottom:1.5rem;">Sign in with your Partners Unlimited admin account.</p>

        <div id="admin-alert" class="admin-alert" hidden role="alert"></div>

        <form id="admin-signin-form" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="admin-email">Email <span class="req" aria-hidden="true">*</span></label>
              <input id="admin-email" name="email" type="email" autocomplete="username" required placeholder="you@example.com">
            </div>
            <div class="field">
              <label for="admin-password">Password <span class="req" aria-hidden="true">*</span></label>
              <div class="pw-field">
                <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" data-pw-toggle aria-pressed="false" aria-label="Show password">
                  <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.1A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a17.4 17.4 0 0 1-5.1 5.1"/><path d="M6.1 6.1A17.5 17.5 0 0 0 2 12s3.5 7 10 7a10.4 10.4 0 0 0 4.2-.9"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="form-actions" style="justify-content:stretch;margin-top:1.25rem;">
            <button class="btn btn-primary admin-btn-block" type="submit" id="admin-signin-btn">Sign in</button>
          </div>
        </form>

        <p class="admin-footnote muted">Access is checked against the database. Non-admin accounts cannot view member records.</p>
      </div>
    </div>
  </section>
</main>

<footer class="admin-footer">
  <div class="container"><p>Partners Unlimited — admin portal (staging)</p></div>
</footer>

</body>
</html>
