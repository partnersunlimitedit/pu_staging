<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set password — Partners Unlimited</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Set or reset your Partners Unlimited member portal password.">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="manifest" href="../site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/main.js" defer></script>
<script src="../assets/js/pu-auth.js" defer></script>
<script src="assets/set-password.js" defer></script>
</head>
<body data-pu-root="../" data-pu-page="set-password" style="background:var(--bg-soft);min-height:100vh;display:flex;flex-direction:column;">

<header class="member-bar">
  <div class="container member-bar-inner">
    <a class="member-brand" href="../member-area.html">
      <img src="../assets/img/logo.png" alt="Partners Unlimited" width="120" height="75">
      <span>Member</span>
    </a>
  </div>
</header>

<main class="member-shell" style="flex:1;">
  <div class="container" style="max-width:28rem;">
    <form class="login-card" id="set-password-form" novalidate>
      <h1 class="section-title" style="font-size:1.35rem;text-align:center;">Set your password</h1>
      <p class="portal-lead muted">Choose a password of at least 8 characters. You’ll be signed in afterwards.</p>
      <div id="sp-alert" class="portal-alert" hidden role="alert"></div>
      <div id="sp-waiting" class="muted" style="text-align:center;">Checking your link…</div>
      <div id="sp-fields" hidden>
        <div class="form-grid">
          <div class="field">
            <label for="sp-password">New password <span class="req">*</span></label>
            <div class="pw-field">
              <input type="password" id="sp-password" name="password" autocomplete="new-password" minlength="8" required>
              <button class="pw-toggle" type="button" data-pw-toggle aria-pressed="false" aria-label="Toggle show/hide password">
                <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="sp-confirm">Confirm password <span class="req">*</span></label>
            <input type="password" id="sp-confirm" name="confirm" autocomplete="new-password" minlength="8" required>
          </div>
        </div>
        <button class="btn btn-primary admin-btn-block" type="submit" id="sp-submit" style="width:100%;margin-top:1.25rem;">Save password</button>
      </div>
      <p class="login-alt"><a href="../member-area.html">Back to sign-in</a></p>
    </form>
  </div>
</main>

<footer class="member-footer">
  <div class="container"><p>Partners Unlimited — member portal (staging)</p></div>
</footer>

</body>
</html>
